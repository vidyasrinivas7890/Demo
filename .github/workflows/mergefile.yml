name: Auto Merge QA to Master

on:
  pull_request:
    types: [opened]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
     
       run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "vidyasrinivas7890/Learning" \
            --auto \
            --squash
            
