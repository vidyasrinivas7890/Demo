name: Auto Merge QA to Master

on:
  pull_request:
    types: [opened]
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.head.ref == 'qa'
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge  5316204182c6d1694e1535c3215cfb815e1208c6 \
            --repo "vidyasrinivas7890/Learning" \
            --auto \
            --squash
